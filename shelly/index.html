<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelly Lingor · Pillar</title>
<meta name="description" content="Shelly Lingor, Chief Executive Officer at Pillar Accounting + Technology.">
<meta name="theme-color" content="#0D1F3C">
<link rel="icon" href="pillar-logo.png">
<link rel="apple-touch-icon" href="pillar-logo.png">
<meta property="og:title" content="Shelly Lingor">
<meta property="og:description" content="Chief Executive Officer, Pillar Accounting + Technology">

<style>
  :root{--navy:#0D1F3C;--blue:#1E5073;--orange:#E05C04;--gold:#FAA84D;
        --wash:#F4F7FA;--rule:rgba(13,31,60,.12);--muted:#5B6B80}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--navy);background-image:linear-gradient(170deg,#123055 0%,#0D1F3C 55%,#091729 100%);
       min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
       padding:22px 16px calc(22px + env(safe-area-inset-bottom));
       font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:var(--navy)}
  .card{width:100%;max-width:430px;background:#fff;border-radius:10px;overflow:hidden;
        box-shadow:0 30px 60px -22px rgba(0,0,0,.7)}
  .head{padding:26px 26px 26px;border-bottom:3px solid var(--orange)}
  .logo{height:38px;width:auto;display:block}
  .portrait{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:50% 18%;
            margin-top:24px;background:var(--wash);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--orange)}
  h1{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(34px,10vw,44px);
     line-height:1.03;letter-spacing:-.015em;margin-top:20px}
  .creds{font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
         color:var(--orange);margin-top:12px}
  .role{font-size:16px;font-weight:500;margin-top:14px;color:var(--blue)}
  .practice{font-size:14.5px;line-height:1.5;color:var(--muted);margin-top:7px;max-width:33ch}
  .ledger{padding:6px 26px 0}
  .row{display:flex;align-items:baseline;gap:14px;padding:15px 2px;
       border-bottom:1px solid var(--rule);text-decoration:none;color:var(--navy)}
  .row:last-child{border-bottom:0}
  .row .lbl{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
            color:var(--muted);width:74px;flex:none}
  .row .val{font-size:15.5px;flex:1;word-break:break-word}
  .row .arw{color:var(--orange);font-size:15px}
  .row:active{background:var(--wash)}
  .foot{padding:22px 26px 26px}
  .save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:19px 20px;
        background:var(--navy);color:#fff;border-radius:6px;font-size:16px;font-weight:700;
        text-decoration:none;box-shadow:0 8px 16px -8px rgba(13,31,60,.75);
        transition:transform .12s ease,box-shadow .12s ease}
  .save:active{transform:translateY(2px);box-shadow:0 2px 6px -4px rgba(13,31,60,.75)}
  .save svg{width:17px;height:17px;stroke:var(--gold);stroke-width:2;fill:none}
  .fine{margin-top:14px;text-align:center;font-size:10px;font-weight:500;letter-spacing:.14em;
        text-transform:uppercase;color:var(--muted)}
  .rise{opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .d1{animation-delay:.04s}.d2{animation-delay:.14s}.d3{animation-delay:.24s}
  .d4{animation-delay:.34s}.d5{animation-delay:.44s}
  @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}.save{transition:none}}
  a:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<main class="card">
  <header class="head">
    <img class="logo rise d1" src="pillar-logo.png" alt="Pillar Accounting + Technology">
    <img class="portrait rise d2" src="headshot.jpg" alt="Shelly Lingor">
    <h1 class="rise d2">Shelly<br>Lingor</h1>
    <p class="role rise d3">Chief Executive Officer</p>
  </header>

  <nav class="ledger rise d4">
    <a class="row" href="tel:+19048815331"><span class="lbl">Cell</span><span class="val">(904) 881-5331</span><span class="arw">&rsaquo;</span></a>
    <a class="row" href="sms:+19048815331"><span class="lbl">Text</span><span class="val">Send a message</span><span class="arw">&rsaquo;</span></a>
    <a class="row" href="tel:+19049383045"><span class="lbl">Office</span><span class="val">(904) 938-3045</span><span class="arw">&rsaquo;</span></a>
    <a class="row" href="mailto:slingor@pillaraccts.com"><span class="lbl">Email</span><span class="val">slingor@pillaraccts.com</span><span class="arw">&rsaquo;</span></a>
    <a class="row" href="https://pillaraccts.com"><span class="lbl">Web</span><span class="val">pillaraccts.com</span><span class="arw">&rsaquo;</span></a>
    <a class="row" href="https://www.linkedin.com/in/shelly-lingor-b5a43032"><span class="lbl">LinkedIn</span><span class="val">Connect with me</span><span class="arw">&rsaquo;</span></a>
  </nav>

  <div class="foot">
    <a class="save rise d5" href="contact.vcf" download="Shelly-Lingor.vcf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      Save to Contacts
    </a>
    <p class="fine rise d5">Opens your contacts app &middot; no app needed</p>
  </div>
</main>
</body>
</html>
